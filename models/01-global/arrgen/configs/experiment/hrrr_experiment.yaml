# @package _global_
defaults:
  - /data: hrrr
  - /model: cnn_unet_sr
  - /loss: edm
  - /precond: edm
  - override /optimizer: adamw

optimizer:
  lr: 0.0001

model:
  in_channels : 2
  out_channels : 2
  inner_channel : 32
  norm_groups : 32
  channel_mults : [1,2, 4, 8, 16]
  attn_res : []
  res_blocks : 3
  dropout : 0

loss:
  P_mean: 0
  P_std: 2
  sigma_data: 1.2

data:
  batch_size: 32
  data_workers: 4

trainer:
  total_kimg: 50000 # 50 mimg
  lr_rampup_kimg: 5000 # 5 mimg
  lr_min_factor: 0.05
  kimg_per_tick: 5
  checkpoint_ticks: 20 # every 20x5 kimg 
  conditional: True
  checkpoint_dir: "<ARRGEN_SRC>/src/results/hrrr_3km/20250811_231554/checkpoints" # Path to checkpoint directory

# Resume control flag
resume: true  # Set to true when you want to resume from checkpoint

experiment_name: hrrr_3km